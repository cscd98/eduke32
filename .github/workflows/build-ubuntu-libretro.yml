name: Build ubuntu x86_64

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-ubuntu-x86_64:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
            sudo apt-get install -y \
            build-essential \
            pkg-config \
            libpng-dev \
            libvorbis-dev \
            libogg-dev

      - name: Build core
        run: |
          cd platform/Libretro
          make -f Makefile.libretro platform=unix
